[project]
name = "typvend"
dynamic = ["version"]
description = "Typst Package Vendoring CLI"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [
    { name = "Diego Alvarez S.", email = "dialvarezs@gmail.com" },
]
keywords = ["typst", "vendoring", "offline", "packages", "cli"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Utilities",
]
dependencies = [
    "platformdirs>=4.9",
    "niquests>=3.18.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
    "pyrefly>=1.0",
]

[project.scripts]
typvend = "typvend.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/typvend/__init__.py"
pattern = '__version__ = "(?P<version>[^"]+)"'

[tool.hatch.build.targets.wheel]
packages = ["src/typvend"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "COM812", # Conflicts with formatter
    "ISC001", # Conflicts with formatter
    "S202", # tarfile.extractall is safe as we use filter/validation
    "TRY301", # Abstract raise is too pedantic
    "TRY400", # We explicitly log or swallow tracebacks based on verbose flag
    "TRY401", # Redundant exception object is preferred for clarity
    "BLE001", # Graceful top-level exception catching is standard in CLIs
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "S101", # asserts are standard in pytest
]

[tool.pyrefly]
project-includes = [
    "**/*.py*",
]
